<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>星际宠物嘟嘟 - 你的外星好朋友</title>
    <style>
        body {
            margin: 0; padding: 0; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #fff; height: 100vh; height: 100dvh; display: flex; flex-direction: column; align-items: center;
            overflow: hidden; -webkit-text-size-adjust: 100%;
        }

        #startOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100dvh;
            background: #0f172a; z-index: 999; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }
        .start-btn {
            padding: 15px 40px; font-size: 20px; font-weight: bold; border-radius: 30px;
            background: #f97316; color: white; border: none; cursor: pointer;
            box-shadow: 0 0 20px rgba(249,115,22,0.5); animation: pulse 2s infinite;
            margin-top: 20px;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .name-input {
            padding: 12px 20px; font-size: 18px; border-radius: 10px; border: 2px solid #38bdf8;
            background: rgba(0,0,0,0.5); color: white; text-align: center; outline: none;
            display: none; margin-top: 20px;
        }
        .start-subtitle {
            margin-top: 18px; padding: 0 24px; text-align: center;
            color: #94a3b8; font-size: 14px; line-height: 1.6;
        }

        .top-bar {
            width: 100%; max-width: 600px; background: rgba(255,255,255,0.1);
            border-radius: 0 0 20px 20px; padding: 15px; display: flex; flex-wrap: wrap; gap: 8px;
            justify-content: space-between; align-items: center; backdrop-filter: blur(10px);
            box-sizing: border-box;
        }
        .pet-info { display: flex; align-items: center; gap: 15px; }
        .friendship-bar-bg { width: 100px; height: 10px; background: #333; border-radius: 10px; overflow: hidden; margin-top: 5px; }
        .friendship-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #f472b6, #fb923c); transition: width 0.5s; }

        .top-right { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
        .icon-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 5px 10px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .icon-btn:hover { background: rgba(255,255,255,0.4); }
        .level-box { font-size: 15px; font-weight: bold; color: #38bdf8; background: rgba(0,0,0,0.3); padding: 5px 10px; border-radius: 10px; }

        .pet-stage { flex: 0 1 auto; width: 100%; display: flex; justify-content: center; align-items: center; position: relative; min-height: 90px; }
        .dudu {
            width: 90px; height: 90px; background: radial-gradient(circle at 30% 30%, #38bdf8, #3b82f6);
            border-radius: 50%; box-shadow: 0 0 40px rgba(56,189,248,0.5);
            animation: float 3s infinite; display: flex; justify-content: center; align-items: center; position: relative;
        }
        .eye { width: 12px; height: 18px; background: white; border-radius: 50%; position: absolute; top: 28px; animation: blink 4s infinite; }
        .eye.left { left: 22px; } .eye.right { right: 22px; }
        .pupil { width: 6px; height: 6px; background: #000; border-radius: 50%; position: absolute; bottom: 3px; left: 3px; }
        .mouth { width: 18px; height: 8px; border-bottom: 4px solid white; border-radius: 0 0 10px 10px; position: absolute; bottom: 18px; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }

        .chat-container { width: 100%; max-width: 600px; flex: 1 1 0; min-height: 0; background: rgba(255,255,255,0.05); border-radius: 20px 20px 0 0; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; box-sizing: border-box; -webkit-overflow-scrolling: touch; }
        .bubble { max-width: 90%; padding: 12px 16px; border-radius: 15px; font-size: 15px; line-height: 1.6; animation: popIn 0.3s ease-out; }
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .bubble.pet { background: #3b82f6; align-self: flex-start; border-bottom-left-radius: 2px; }
        .bubble.user { background: #22c55e; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bubble.fact { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); align-self: flex-start; border: 2px solid #fcd34d; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); }
        .bubble.loading { background: #475569; color: #cbd5e1; }

        .bottom-area { width: 100%; max-width: 600px; flex: 0 0 auto; max-height: 48vh; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 15px; padding-bottom: calc(15px + env(safe-area-inset-bottom)); background: rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; }
        .options-grid { display: flex; flex-direction: column; gap: 10px; }
        .option-btn {
            width: 100%; padding: 15px; border-radius: 15px; border: 2px solid #38bdf8;
            background: rgba(56,189,248,0.2); color: white; font-size: 16px;
            cursor: pointer; text-align: left; font-weight: bold; transition: 0.2s;
        }
        .option-btn:hover { background: rgba(56,189,248,0.4); }
        .help-btn { border-color: #fbbf24; color: #fbbf24; text-align: center; background: rgba(251,191,36,0.2); }
        .next-btn { border-color: #22c55e; color: #22c55e; text-align: center; background: rgba(34,197,94,0.2); display: none; margin-top: 10px;}

        .input-area { display: none; gap: 10px; }
        .input-area.active { display: flex; }
        .input-area input { flex: 1; padding: 12px 15px; border-radius: 25px; border: none; outline: none; font-size: 16px; background: rgba(255,255,255,0.9); color: #333; }
        .input-area button { padding: 0 25px; border-radius: 25px; border: none; cursor: pointer; background: #f97316; color: white; font-weight: bold; font-size: 16px; }

        #wrongBookModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000; flex-direction: column;
            justify-content: center; align-items: center;
        }
        .modal-content {
            width: 90%; max-width: 500px; max-height: 80vh; background: #1e293b;
            border-radius: 20px; padding: 20px; overflow-y: auto; border: 2px solid #38bdf8;
        }
        .wrong-item { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .wrong-item h4 { margin: 0 0 10px 0; color: #38bdf8; font-size: 16px; }
        .wrong-item p { margin: 5px 0; font-size: 14px; color: #cbd5e1; }
        .wrong-item .correct-ans { color: #22c55e; font-weight: bold; }

        @media (max-width: 480px) {
            .top-bar { padding: 10px 12px; }
            .icon-btn { font-size: 12px; padding: 4px 8px; }
            .level-box { font-size: 13px; padding: 4px 8px; }
            .chat-container { padding: 14px; gap: 12px; }
            .bubble { font-size: 14px; padding: 10px 13px; }
            .option-btn { padding: 12px; font-size: 15px; }
            .bottom-area { padding: 12px; }
        }
    </style>
</head>
<body>

    <div id="startOverlay">
        <div style="width: 100px; height: 100px; background: #38bdf8; border-radius: 50%; margin-bottom: 20px; box-shadow: 0 0 40px #38bdf8;"></div>
        <button class="start-btn" id="wakeBtn" onclick="startInteraction()">点击唤醒星际宠物</button>
        <input type="text" id="nameInput" class="name-input" placeholder="输入名字，按回车交朋友" onkeypress="handleNameEnter(event)">
        <div class="start-subtitle" id="dailyHint">每天 10 道科学小发现 · 打开就能玩</div>
    </div>

    <div id="wrongBookModal">
        <div class="modal-content">
            <h3 style="text-align: center; color: #fbbf24; margin-top: 0;">📕 嘟嘟的错题本</h3>
            <div id="wrongList"></div>
            <button class="start-btn" style="width: 100%; margin-top: 10px; font-size: 16px; animation: none;" onclick="closeWrongBook()">关闭错题本</button>
        </div>
    </div>

    <div class="top-bar">
        <div class="pet-info">
            <div>
                <div id="petLevelText" style="font-weight: bold;">好朋友 嘟嘟</div>
                <div class="friendship-bar-bg"><div class="friendship-bar" id="friendshipBar"></div></div>
            </div>
        </div>
        <div class="top-right">
            <div class="level-box" id="streakDisplay" style="display:none; color:#fbbf24;"></div>
            <div class="level-box" id="levelDisplay">今日挑战 1/10</div>
            <button class="icon-btn" onclick="openWrongBook()">📕 错题本</button>
            <button class="icon-btn" onclick="resetAll()">🔄 重置</button>
        </div>
    </div>

    <div class="pet-stage">
        <div class="dudu">
            <div class="eye left"><div class="pupil"></div></div>
            <div class="eye right"><div class="pupil"></div></div>
            <div class="mouth"></div>
        </div>
    </div>

    <div class="chat-container" id="chatContainer"></div>

    <div class="bottom-area">
        <div class="options-grid" id="optionsGrid"></div>
        <div class="input-area" id="inputArea">
            <input type="text" id="userInput" placeholder="和嘟嘟聊聊天吧..." onkeypress="handleEnter(event)">
            <button onclick="sendFreeChat()">发送</button>
        </div>
    </div>

    <script src="questions.js"></script>
    <script src="config.js"></script>
    <script>
        // ================= 内置科学题库（无需联网、无需 Key） =================
        // 没有配置 DeepSeek Key 时，嘟嘟每天从题库中抽取 10 道题（每个学科 2 道）。
        const LOCAL_QUESTIONS = [

                options: ["A. 山里面住着一个会学人说话的小精灵", "B. 声音撞到山壁后被反弹回来", "C. 风把我的声音吹回来了"],
                correct: "B. 声音撞到山壁后被反弹回来",
                feedback_correct: "你太厉害了！一下子就说中了！",
                feedback_wrong: "再想一想，声音是不是也像皮球一样，撞到墙上会弹回来？",

                fun_question: "那我在空荡荡的大房间里说话，为什么也会听到一点点回声呢？",
                fun_options: ["A. 房间里的空气在学我说话", "B. 声音在墙壁之间来回反弹", "C. 我的耳朵出问题了"],
                fun_correct: "B. 声音在墙壁之间来回反弹",
                fun_result: "没错！空房间里没有沙发、窗帘这些软软的东西吸音，声音撞到墙上会来回弹，所以就能听到回声。你可以去家里的空房间试一试！"
            },
            {
                subject: "物理",
                scene: "今天下雨后，地上结了一层薄薄的冰。我踩上去，哧溜一下滑出去好远，差点摔个屁股墩！为什么冰面这么滑呀？",
                question: "为什么走在冰面上特别容易滑倒？",

                feedback_correct: "答对啦！你观察得真仔细！",

                fun_question: "那为什么在冰面上撒一些沙子，就不那么滑了？",
                fun_options: ["A. 沙子把冰面加热了", "B. 沙子增加了鞋底和地面的摩擦力", "C. 沙子把冰面盖住了，看不见了"],

            },
            {

                question: "为什么摩擦过的气球能吸起头发？",
                options: ["A. 气球上沾了胶水", "B. 摩擦让气球带上了静电", "C. 头发自己想飞起来"],

                feedback_correct: "太棒了！你连静电都知道！",
                feedback_wrong: "再想想，冬天脱毛衣时是不是会听到噼里啪啦的声音？那是什么在捣鬼？",
                explain: "气球和头发摩擦时，会发生电子的转移，气球带上静电。带电的气球就能吸引轻小的东西，比如头发、纸屑。这在科学上叫【静电】。",

            {

        function hashString(str) {
            let h = 2166136261;
            for (let i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);
                h = Math.imul(h, 16777619);
            }
            return h >>> 0;
        }

        function mulberry32(seed) {
            return function() {
                seed |= 0;
                seed = seed + 0x6D2B79F5 | 0;
                let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        function seededShuffle(arr, seed) {
            const a = arr.slice();
            const rand = mulberry32(seed);
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(rand() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

            return y + "-" + m + "-" + d;

        const DAILY_PER_SUBJECT = 2;

        let dailyQuestions = null;

        // 按日期确定当天题目：同一天打开永远是同一套，第二天自动换新。
        // 每个学科内部先把题目按“周期”打乱，再按天取连续两题，保证一轮内不重复。
        function buildDailyQuestions(date) {
            const day = localDayNumber(date);
            const picked = [];
            DAILY_SUBJECTS.forEach(function(subject) {
                const pool = LOCAL_QUESTIONS.filter(function(q) { return q.subject === subject; });
                if (pool.length === 0) return;
                const daysPerCycle = Math.max(1, Math.floor(pool.length / DAILY_PER_SUBJECT));
                const cycle = Math.floor(day / daysPerCycle);
                const offset = ((day % daysPerCycle) + daysPerCycle) % daysPerCycle * DAILY_PER_SUBJECT;
                const shuffled = seededShuffle(pool, hashString(subject + "#" + cycle));
                for (let i = 0; i < DAILY_PER_SUBJECT && i < shuffled.length; i++) {
                    picked.push(shuffled[(offset + i) % shuffled.length]);
                }
            });
            // 当天 10 题再打乱一次顺序，避免每天都是物理先开始
            return seededShuffle(picked, hashString(localDateKey(date) + "#daily"));
        }

        // 打乱选项顺序并重新标注 A/B/C，避免正确答案总在同一个位置
        function prepareOptions(options, correctText, seed) {
            const strip = function(text) {
                return String(text == null ? "" : text).replace(/^\s*[A-Da-d][.、．:：)]\s*/, "").trim();
            };
            const bare = (options || []).map(strip);
            const correctBare = strip(correctText);
            const shuffled = seededShuffle(bare, seed);
            const labels = ["A. ", "B. ", "C. ", "D. "];
            const relabeled = shuffled.map(function(text, i) {
                return (labels[i] || (i + 1) + ". ") + text;
            });
            const idx = shuffled.indexOf(correctBare);
            return {
                options: relabeled,
                correct: idx >= 0 ? relabeled[idx] : correctText
            };
        }

        function getDailyQuestions() {
            if (!dailyQuestions) {
                const dateKey = localDateKey(new Date());
                dailyQuestions = buildDailyQuestions(new Date()).map(function(q) {
                    const base = Object.assign({}, q);
                    const main = prepareOptions(q.options, q.correct, hashString(q.question + "#" + dateKey));
                    base.options = main.options;
                    base.correct = main.correct;
                    base.fun_options = [];
                    base.fun_correct = "";
                    if (q.fun_question && Array.isArray(q.fun_options) && q.fun_options.length >= 2 && q.fun_correct) {
                        const fun = prepareOptions(q.fun_options, q.fun_correct, hashString(q.question + "#fun#" + dateKey));
                        base.fun_options = fun.options;
                        base.fun_correct = fun.correct;
                    }
                    return base;
                });
            }
            return dailyQuestions;
        }

        // 取当前关卡对应的当天题目，并复制一份，避免流程中修改到题库原始数据
        function localLevel() {
            const list = getDailyQuestions();
            if (list.length === 0) {
                return {
                    subject: "天文",
                    scene: "今晚我抬头看天空，发现星星一闪一闪的。",
                    question: "星星为什么会一闪一闪的？",
                    options: ["A. 星星在眨眼", "B. 星光穿过大气层时发生折射", "C. 星星快熄灭了"],
                    correct: "B. 星光穿过大气层时发生折射",
                    feedback_correct: "答对啦！",
                    feedback_wrong: "再想一想。",
                    explain: "星光穿过流动的大气层时发生折射，看起来就像在眨眼。",
                    fun_question: "", fun_options: [], fun_correct: "", fun_result: ""
                };
            }
            const q = list[(currentLevel - 1) % list.length];
            return Object.assign({}, q, {
                options: q.options.slice(),
                fun_options: (q.fun_options || []).slice()
            });
        }

        function localChatReply(text) {
            let pool = LOCAL_CHAT.general;
            if (/星|月|太阳|宇宙|太空|流星/.test(text)) pool = LOCAL_CHAT.space;
            else if (/植物|花|树|叶|种子|草/.test(text)) pool = LOCAL_CHAT.plant;
            else if (/动物|猫|狗|鸟|鱼|虫|蚂蚁/.test(text)) pool = LOCAL_CHAT.animal;
            else if (/雨|云|风|雪|天气|海|山|河/.test(text)) pool = LOCAL_CHAT.weather;
            return pool[Math.floor(Math.random() * pool.length)];
        }

    <script>
        // ================= 配置区（可选） =================
        // 不配置 Key 也能完整玩：默认使用内置题库 + questions.js 扩展题库，每天 10 道。
        // 如果本地存在 config.js 并填了 DeepSeek Key，会自动启用 AI 生成内容。
        const DEEPSEEK_API_KEY = (window.DUDU_CONFIG && window.DUDU_CONFIG.DEEPSEEK_API_KEY) || "";
        const USE_AI = !!DEEPSEEK_API_KEY && !DEEPSEEK_API_KEY.includes("在这里");
        // ==================================================

        // localStorage 在微信内置浏览器 / 隐私模式下可能不可用，做一层安全封装
        function storeGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function storeSet(key, value) {
            try { localStorage.setItem(key, value); } catch (e) { /* 忽略存储失败 */ }
        }

        let studentName = storeGet('dudu_student_name') || "";
        let wrongBook;
        try { wrongBook = JSON.parse(storeGet('dudu_wrong_book')) || []; } catch (e) { wrongBook = []; }
        if (!Array.isArray(wrongBook)) wrongBook = [];

        let intimacy = 0;
        let currentVoice = null;
        let currentLevel = 1;
        const MAX_LEVEL = 10;
        let storyMemory = "你是外星宠物嘟嘟，有实体和手脚。你寄宿在好朋友家里，每天自己去探索地球的奇妙现象。";

        // ---------- 连续学习天数 ----------
        function previousDateKey() {
            const d = new Date();
            d.setDate(d.getDate() - 1);
            return localDateKey(d);
        }

        function updateStreakDisplay() {
            const el = document.getElementById('streakDisplay');
            if (!el) return;
            const today = localDateKey(new Date());
            const lastDone = storeGet('dudu_last_done') || '';
            let streak = parseInt(storeGet('dudu_streak') || '0', 10) || 0;
            // 只有昨天或今天完成过，连续天数才算还在延续
            if (lastDone !== today && lastDone !== previousDateKey()) streak = 0;
            if (streak > 0) {
                el.style.display = '';
                el.innerText = `🔥 连续 ${streak} 天`;
            } else {
                el.style.display = 'none';
            }
        }

        function markTodayDone() {
            const today = localDateKey(new Date());
            if (storeGet('dudu_last_done') === today) {
                updateStreakDisplay();
                return;
            }
            let streak = parseInt(storeGet('dudu_streak') || '0', 10) || 0;
            streak = (storeGet('dudu_last_done') === previousDateKey()) ? streak + 1 : 1;
            storeSet('dudu_last_done', today);
            storeSet('dudu_streak', String(streak));
            updateStreakDisplay();
        }

        function updateDailyHint() {
            const el = document.getElementById('dailyHint');
            if (!el) return;
            const now = new Date();
            el.innerText = `${now.getMonth() + 1} 月 ${now.getDate()} 日 · 今日 10 道科学小发现`;
        }

        updateDailyHint();
        updateStreakDisplay();

        function initVoice() {
            if (!('speechSynthesis' in window)) return;
            try {
                let voices = window.speechSynthesis.getVoices();
                currentVoice = voices.find(v => v.lang.includes('zh') && (v.name.includes('Xiaoxiao') || v.name.includes('Yunxi')))
                            || voices.find(v => v.lang.includes('zh-CN')) || voices[0];
            } catch (e) { currentVoice = null; }
        }
        if ('speechSynthesis' in window) {
            try { window.speechSynthesis.onvoiceschanged = initVoice; } catch (e) {}
        }

        async function startInteraction() {
            // 在用户点击时初始化语音（iOS / 微信要求在用户手势中触发）
            try {
                if ('speechSynthesis' in window && 'SpeechSynthesisUtterance' in window) {
                    let u = new SpeechSynthesisUtterance("");
                    window.speechSynthesis.speak(u);
                    initVoice();
                }
            } catch (e) {}

            if(studentName) {
                document.getElementById('startOverlay').style.display = 'none';
                await speakText(`哈喽，今天过得怎么样呀？`);
                startDailyChat();
            } else {
                document.getElementById('wakeBtn').style.display = 'none';
                document.getElementById('nameInput').style.display = 'block';
                document.getElementById('nameInput').focus();
                await speakText("哇！地球好大呀！你好，我是外星宠物嘟嘟，你叫什么名字呀？");
            }
        }

        async function handleNameEnter(e) {
            if(e.key === 'Enter') {
                let val = document.getElementById('nameInput').value.trim();
                if(val) {
                    studentName = val;
                    storeSet('dudu_student_name', studentName);
                    document.getElementById('nameInput').style.display = 'none';
                    document.getElementById('startOverlay').style.display = 'none';
                    
                    await speakText(`很高兴认识你！我们做好朋友吧！`);
                    setTimeout(() => startDailyChat(), 2000);
                }
            }
        }

        // 语音朗读过滤网（过滤语气词、Emoji等）
        // 微信内置浏览器可能没有可用语音，必须有兜底，否则会卡在 onend 上。
        let speechUnavailable = false;
        function speechVoicesReady() {
            if (!('speechSynthesis' in window)) return false;
            try { return window.speechSynthesis.getVoices().length > 0; } catch (e) { return false; }
        }

        function speakText(text) {
            return new Promise((resolve) => {
                if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) { resolve(); return; }
                if (speechUnavailable) { resolve(); return; }

                let cleanText = text
                    .replace(/💡【嘟嘟的神奇小拓展】：/g, "对了，再告诉你一个神奇小拓展！")
                    .replace(/🎉 /g, "")
                    .replace(/\(亲密度\+10\)/g, "")
                    .replace(/[\u{1F300}-\u{1F9FF}]/gu, "")
                    .replace(/🤔/g, "");

                if (!cleanText.trim()) { resolve(); return; }

                const startSpeech = () => {
                    let utterance;
                    try { utterance = new SpeechSynthesisUtterance(cleanText); }
                    catch (e) { resolve(); return; }

                    let done = false;
                    let watchdog = null;
                    const finish = () => {
                        if (done) return;
                        done = true;
                        if (watchdog) clearTimeout(watchdog);
                        resolve();
                    };

                    utterance.lang = 'zh-CN'; utterance.rate = 1.1; utterance.pitch = 1.6;
                    if (currentVoice) utterance.voice = currentVoice;
                    utterance.onend = finish;
                    utterance.onerror = finish;
                    utterance.onstart = () => {
                        // 已开始朗读：按文字长度给一个宽松的兜底时间
                        if (watchdog) clearTimeout(watchdog);
                        watchdog = setTimeout(() => {
                            try { window.speechSynthesis.cancel(); } catch (e) {}
                            finish();
                        }, Math.max(10000, Math.min(60000, cleanText.length * 400)));
                    };
                    // 引擎既不触发 onstart 也不触发 onend 时，最多等 12 秒
                    watchdog = setTimeout(() => {
                        try { window.speechSynthesis.cancel(); } catch (e) {}
                        finish();
                    }, 12000);

                    try {
                        window.speechSynthesis.cancel();
                        window.speechSynthesis.speak(utterance);
                    } catch (e) { finish(); }
                };

                if (!speechVoicesReady()) {
                    // 有些浏览器语音列表是异步加载的，稍等片刻再判断
                    initVoice();
                    setTimeout(() => {
                        initVoice();
                        if (!speechVoicesReady()) {
                            speechUnavailable = true;
                            resolve();
                            return;
                        }
                        startSpeech();
                    }, 1200);
                } else {
                    startSpeech();
                }
            });
        }

        async function addMessage(text, type = 'pet') {
            const chatContainer = document.getElementById('chatContainer');
            const bubble = document.createElement('div');
            bubble.className = `bubble ${type}`;
            bubble.innerText = text; 
            chatContainer.appendChild(bubble);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            if(type !== 'user') await speakText(text); 
        }

        async function callAI(systemPrompt, userPrompt) {
            try {
                let res = await fetch("https://api.deepseek.com/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${DEEPSEEK_API_KEY}` },
                    body: JSON.stringify({ 
                        model: "deepseek-chat", 
                        messages: [{role:"system", content: systemPrompt}, {role:"user", content: userPrompt}], 
                        temperature: 0.85 
                    })
                });
                let data = await res.json();
                return data.choices[0].message.content;
            } catch(e) { return "网络故障。"; }
        }

        async function startDailyChat() {
            await addMessage(`今天我准备了 10 个地球上的新发现！`, 'pet');
            await addMessage(`你愿意听我分享，并帮我解答疑惑吗？`, 'pet');
            loadLevel();
        }

        async function loadLevel() {
            document.getElementById('levelDisplay').innerText = `今日挑战 ${currentLevel}/${MAX_LEVEL}`;
            document.getElementById('optionsGrid').innerHTML = "";
            document.getElementById('inputArea').classList.remove('active');

            const chatContainer = document.getElementById('chatContainer');
            let q = null;

            if (USE_AI) {
                const loadingBubble = document.createElement('div');
                loadingBubble.className = 'bubble pet loading';
                loadingBubble.innerText = "嘟嘟正在思考...";
                chatContainer.appendChild(loadingBubble);
                chatContainer.scrollTop = chatContainer.scrollHeight;

                // 核心 Prompt 重写：随机学科、自然称呼、禁哈哈、少叫名字
                let sysPrompt = `
                    你是一个外星宠物（嘟嘟），有实体和手脚，生活在地球好朋友的家里。
                    背景：${storyMemory}
                    现在是第 ${currentLevel} 个分享。

                    【⚠️ 绝对不可违反的死命令】：
                    1. 语气称呼：像真正的好朋友一样自然对话。大部分时候用“你”即可。绝对禁止使用“主人”和“哈哈”，绝对禁止每次说话都叫名字（只有在强烈夸奖时才叫【${studentName}】）。
                    2. 场景：必须是你【自己】的经历，绝不能出现“帮你”、“看你”。物品叫真名。
                    3. 学科广度（重点）：绝对不准全是物理题！请从【物理、化学、生物（植物/动物）、天文（星星/宇宙）、地理（天气/地貌）】中随机挑选一个学科，作为本关的主题。
                    4. 解释：先用大白话打比方，再说：“这在科学上叫【XX】。”
                    5. 趣味猜猜看：提出一个有趣的现象，给三个猜测选项。

                    请严格返回单行 JSON：
                    {"scene":"今天我...",
                     "question":"题目", "options":["A. xx","B. xx","C. xx"], "correct":"A. xx",
                     "feedback_correct":"你太棒啦！...", "feedback_wrong":"哎呀，再想一想...",
                     "explain":"大白话比喻+顺嘴提词汇",
                     "fun_question":"如果我把...你猜会发生什么？", "fun_options":["A. xx","B. xx","C. xx"], "fun_correct":"A. xx",
                     "fun_result":"揭晓答案+解释，并鼓励他自己试试"}
                `;
                let resText = await callAI(sysPrompt, "请分享今天的日常");

                if (loadingBubble.parentNode === chatContainer) chatContainer.removeChild(loadingBubble);

                try {
                    let jsonStr = resText.substring(resText.indexOf('{'), resText.lastIndexOf('}') + 1);
                    q = JSON.parse(jsonStr);
                    if (!q || !q.question || !Array.isArray(q.options) || q.options.length < 2 || !q.correct) {
                        throw new Error("AI 返回内容不完整");
                    }
                    q.scene = (q.scene || "今天我又发现了一个有趣的现象！").replace(/帮你/g, "").replace(/看你/g, ""); // 防幻觉
                    // 前端强制过滤“哈哈”和“主人”
                    q.feedback_correct = (q.feedback_correct || "答对啦！").replace(/哈哈/g, "").replace(/主人/g, "你");
                    q.feedback_wrong = (q.feedback_wrong || "再想一想哦。").replace(/哈哈/g, "").replace(/主人/g, "你");
                    q.fun_result = (q.fun_result || "").replace(/哈哈/g, "").replace(/主人/g, "你");
                    storyMemory += ` 刚才聊了：${q.scene}`;
                } catch(e) {
                    // AI 返回异常时改用内置题目，保证游戏不中断
                    q = localLevel();
                }
            } else {
                // 没有配置 Key：直接使用内置题库，打开即玩
                q = localLevel();
            }

            await addMessage(q.scene, 'pet');
            await addMessage(q.question, 'pet');

            let grid = document.getElementById('optionsGrid');
            q.options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, q);
                grid.appendChild(btn);
            });

            let helpBtn = document.createElement('button');
            helpBtn.className = 'option-btn help-btn';
            helpBtn.innerText = "🤔 我不知道，求嘟嘟提示";
            helpBtn.onclick = () => checkAnswer("我不知道", q);
            grid.appendChild(helpBtn);
        }

        async function checkAnswer(selected, q) {
            document.getElementById('optionsGrid').innerHTML = "";
            let userText = selected === "我不知道" ? "我不知道，求提示" : `我选：${selected}`;
            await addMessage(userText, 'user');

            let isCorrect = (selected === q.correct);
            let reply;

            if (isCorrect) {
                reply = q.feedback_correct;
            } else if (q.is_extra) {
                // 新增题目没有逐题写提示词，答错或求助时直接把科学道理讲清楚，再让孩子试一次
                if (!q._explained) {
                    reply = (selected === "我不知道" ? "没关系，嘟嘟给你讲讲：" : "差一点点，嘟嘟给你讲讲：") + q.explain;
                    q._explained = true;
                } else {
                    reply = "再仔细看看嘟嘟刚才的讲解，想想哪个选项最符合。";
                }
            } else {
                // 原文件里的 40 道题保留各自写好的提示词，不做改动
                reply = q.feedback_wrong;
            }

            await addMessage(reply, 'pet');

            if(isCorrect) {
                if (q.is_extra && q._explained) {
                    await addMessage(`这次记住啦！`, 'pet');
                } else {
                    await addMessage(`🎉 ${q.explain}`, 'pet');
                }

                intimacy += 10;
                document.getElementById('friendshipBar').style.width = (currentLevel * 10) + '%';
                currentLevel++;

                setTimeout(() => startFunExperiment(q), 2000);

            } else {
                recordWrongQuestion(q, selected);
                let grid = document.getElementById('optionsGrid');
                q.options.forEach(opt => {
                    let btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt;
                    btn.onclick = () => checkAnswer(opt, q);
                    grid.appendChild(btn);
                });
            }
        }

        async function startFunExperiment(q) {
            if(!q.fun_question || !Array.isArray(q.fun_options) || !q.fun_correct) { endLevel(); return; }

            await addMessage(`💡【嘟嘟的神奇小拓展】：${q.fun_question}`, 'fact');

            let grid = document.getElementById('optionsGrid');
            grid.innerHTML = "";
            q.fun_options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkFunAnswer(opt, q);
                grid.appendChild(btn);
            });
        }

        async function checkFunAnswer(selected, q) {
            document.getElementById('optionsGrid').innerHTML = ""; 
            await addMessage(`我猜：${selected}`, 'user');

            let isCorrect = (selected === q.fun_correct);
            // 同样在前端拦截哈哈
            let resultText = (q.fun_result || "").replace(/哈哈/g, "").replace(/主人/g, "你");

            if(isCorrect) {
                await addMessage(`🎉 哇！你猜对啦！${resultText}`, 'pet');
            } else {
                await addMessage(`其实正确答案是【${q.fun_correct}】。${resultText}`, 'pet');
            }

            endLevel();
        }

        function endLevel() {
            if(currentLevel <= MAX_LEVEL) {
                let grid = document.getElementById('optionsGrid');
                let nextBtn = document.createElement('button');
                nextBtn.className = 'option-btn next-btn';
                nextBtn.innerText = "听下一个故事！";
                nextBtn.style.display = "block";
                nextBtn.onclick = () => {
                    grid.innerHTML = "";
                    loadLevel();
                };
                grid.appendChild(nextBtn);
            } else {
                document.getElementById('levelDisplay').innerText = "今日挑战完成";
                markTodayDone();
                addMessage(`今天的 10 个科学发现完成啦！我学到了好多科学魔法！`, 'pet');
                addMessage(`明天再来，嘟嘟会准备新的 10 个问题。快去休息吧！`, 'pet');
                document.getElementById('inputArea').classList.add('active');
            }
        }

        function recordWrongQuestion(q, selected) {
            if(!wrongBook.some(item => item.question === q.question)) {
                wrongBook.push({ question: q.question, correct: q.correct, explain: q.explain });
                storeSet('dudu_wrong_book', JSON.stringify(wrongBook));
            }
        }

        function openWrongBook() {

                        <p>题目：${item.question}</p>
                        <p class="correct-ans">正确答案：${item.correct}</p>
                        <p>嘟嘟解析：${item.explain}</p>

            });
            modal.style.display = 'flex';
        }

        function closeWrongBook() { document.getElementById('wrongBookModal').style.display = 'none'; }
        function resetAll() {

                location.reload();

        async function sendFreeChat() {
            let input = document.getElementById('userInput');
            let text = input.value.trim();
            if (!text) return;
            input.value = '';
            await addMessage(text, 'user');

            let reply;
            if (USE_AI) {
                let sysPrompt = `你是外星宠物嘟嘟，正在聊天。用生动有趣的语言回答问题，多用比喻。绝对不能叫主人，绝对不能说哈哈。`;
                reply = await callAI(sysPrompt, text);
                reply = (reply || "").replace(/哈哈/g, "").replace(/主人/g, "你");
                if (!reply || reply === "网络故障。") reply = localChatReply(text);
            } else {
                // 离线模式：根据关键词从本地回复中挑选
                reply = localChatReply(text);
            }
            await addMessage(reply, 'pet');
        }

        function handleEnter(e) { if (e.key === 'Enter') sendFreeChat(); }
    </script>
</body>
</html>
